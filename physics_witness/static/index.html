<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Physics Witness</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%233a5bd9%22/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f5f6f8; --panel: #ffffff; --ink: #16181d; --muted: #5d6470; --line: #e2e5ea; --soft: #eef0f3;
    --accent: #3a5bd9; --ok: #1f8a4c; --ok-bg: #e3f4ea; --bad: #c2352b; --bad-bg: #fbe6e4;
    --unk: #9a6a00; --unk-bg: #fbf1d9; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e8eaee; --muted: #9aa3b2; --line: #2a2f3a; --soft: #1f232c;
      --accent: #7d97ff; --ok: #4cc27f; --ok-bg: #16301f; --bad: #ff7a70; --bad-bg: #3a1a18;
      --unk: #e2b44d; --unk-bg: #33280f; --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, textarea, select { font: inherit; color: inherit; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .brand { font-weight: 700; letter-spacing: .2px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  .brand .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
  header .spacer { flex: 1; }
  select, input[type=text], input[type=date], textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; }
  select { max-width: 320px; }
  .btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 7px 14px; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: .6; cursor: default; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px; background: var(--soft); color: var(--muted); white-space: nowrap; }
  .pill.on { color: var(--ok); background: var(--ok-bg); }

  main { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; padding: 16px 20px 32px; max-width: 1500px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
  .card + .card { margin-top: 16px; }
  .card h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  .pad { padding: 14px 16px; }

  video { width: 100%; display: block; background: #000; border-radius: 12px 12px 0 0; max-height: 58vh; }
  .timeline { position: relative; height: 44px; margin: 12px 16px 4px; cursor: pointer; }
  .track { position: absolute; left: 0; right: 0; top: 19px; height: 6px; background: var(--soft); border-radius: 3px; }
  .tick { position: absolute; top: 16px; width: 2px; height: 12px; background: var(--line); transform: translateX(-1px); }
  .mark { position: absolute; top: 4px; width: 12px; height: 12px; border-radius: 50%; transform: translateX(-6px); border: 2px solid var(--panel); }
  .mark.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
  .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent); pointer-events: none; }
  .timeinfo { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; color: var(--muted); font-size: 12px; padding: 0 16px 12px; font-variant-numeric: tabular-nums; }

  .v-supported { --c: var(--ok); --cb: var(--ok-bg); }
  .v-contradicted { --c: var(--bad); --cb: var(--bad-bg); }
  .v-cant_tell { --c: var(--unk); --cb: var(--unk-bg); }
  .mark.v-supported, .mark.v-contradicted, .mark.v-cant_tell { background: var(--c); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; color: var(--c); background: var(--cb); white-space: nowrap; }

  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stat { border-radius: 10px; padding: 10px 12px; background: var(--cb); }
  .stat b { display: block; font-size: 22px; color: var(--c); font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }

  .sentence { padding: 10px 0; border-top: 1px solid var(--line); }
  .sentence:first-child { border-top: 0; padding-top: 0; }
  .sentence > q { display: block; color: var(--muted); font-style: italic; margin-bottom: 6px; quotes: "\201C" "\201D"; }
  .claim { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: start; padding: 8px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .claim:hover { background: var(--soft); }
  .claim.sel { border-color: var(--c); background: var(--cb); }
  .claim.live { box-shadow: inset 3px 0 0 var(--accent); }
  .claim .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; }

  .evidence .head { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .evidence .claimtext { font-weight: 600; }
  .why { margin: 6px 0 10px; }
  .need { border-left: 3px solid var(--unk); background: var(--unk-bg); padding: 8px 10px; border-radius: 0 8px 8px 0; margin-bottom: 10px; }
  .frames { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; }
  .frames figure { margin: 0; flex: 0 0 auto; cursor: pointer; }
  .frames img { height: 96px; border-radius: 6px; border: 1px solid var(--line); display: block; }
  .frames figcaption { font-size: 11px; color: var(--muted); text-align: center; }
  .obs { list-style: none; padding: 0; margin: 10px 0 0; }
  .obs li { padding: 6px 0; border-top: 1px dashed var(--line); font-size: 13px; }
  .obs .when { color: var(--accent); cursor: pointer; font-variant-numeric: tabular-nums; margin-right: 6px; }
  .muted { color: var(--muted); }
  .src { font-size: 12px; }
  .src a { color: var(--accent); }
  .banner { padding: 10px 14px; border-radius: 10px; background: var(--unk-bg); color: var(--unk); margin-bottom: 16px; font-size: 13px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 0 20px 24px; }

  dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; background: var(--panel); color: var(--ink); width: min(560px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px 20px; display: grid; gap: 12px; }
  dialog label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  dialog textarea { min-height: 120px; resize: vertical; }
  dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
  .err { color: var(--bad); font-size: 13px; min-height: 1em; }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="dot"></span>Physics Witness</div>
  <select id="picker" aria-label="Claim"></select>
  <span class="spacer"></span>
  <span id="svc-nebius" class="pill">Token Factory</span>
  <span id="svc-tavily" class="pill">Tavily</span>
  <button class="btn primary" id="new">New claim</button>
</header>

<main id="app">
  <div class="empty" style="grid-column: 1 / -1">Loading…</div>
</main>
<footer>Evidence for a human adjuster, never a fraud verdict. "Can't tell" means the footage does not settle the claim.</footer>

<dialog id="dlg">
  <form id="form" method="dialog">
    <strong>New claim</strong>
    <label>Video<input type="file" name="video" accept="video/*" required></label>
    <label>Claimant's story<textarea name="story" required placeholder="I was stopped at the red light when the other car hit my rear bumper…"></textarea></label>
    <div class="row">
      <label>Place (optional)<input type="text" name="place" placeholder="MG Road, Bengaluru"></label>
      <label>Date (optional)<input type="date" name="date"></label>
    </div>
    <label>Title (optional)<input type="text" name="title"></label>
    <div class="err" id="form-err"></div>
    <div class="actions">
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit" id="submit">Check story</button>
    </div>
  </form>
</dialog>

<script>
const VERDICT = { supported: "Supported", contradicted: "Contradicted", cant_tell: "Can't tell" };
const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined && v !== false) el.setAttribute(k, v);
  }
  for (const kid of kids.flat(Infinity)) if (kid !== null && kid !== undefined && kid !== false)
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return el;
};
const fmt = t => (t == null ? "–" : `${Number(t).toFixed(2)}s`);

let state = { id: null, data: null, selected: null, poll: null };

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

async function loadHealth() {
  try {
    const s = await api("/api/health");
    $("#svc-nebius").classList.toggle("on", s.nebius);
    $("#svc-nebius").textContent = s.nebius ? "Token Factory: live" : "Token Factory: offline";
    $("#svc-tavily").classList.toggle("on", s.tavily);
    $("#svc-tavily").textContent = s.tavily ? "Tavily: live" : "Tavily: offline";
  } catch {}
}

async function loadList(selectId) {
  const list = await api("/api/claims");
  const picker = $("#picker");
  picker.replaceChildren(...list.map(m => h("option", { value: m.id }, `${m.title || m.id}${m.status !== "done" ? ` (${m.status})` : ""}`)));
  picker.hidden = !list.length;
  const id = selectId || (list.find(m => m.id === state.id) || list[0] || {}).id;
  if (!id) return renderEmpty();
  picker.value = id;
  if (id !== state.id || !state.data) await open(id);
}

async function open(id) {
  clearTimeout(state.poll);
  state = { id, data: await api(`/api/claims/${id}`), selected: null, poll: null };
  const { meta } = state.data;
  if (meta.status === "queued" || meta.status === "running") {
    renderPending(meta);
    state.poll = setTimeout(() => open(id).then(() => state.data.meta.status === "done" && loadList(id)), 2000);
    return;
  }
  if (meta.status === "error") return renderError(meta);
  render();
}

function renderEmpty() {
  $("#app").replaceChildren(h("div", { class: "empty", style: "grid-column:1/-1" },
    h("p", {}, "No claims yet."), h("button", { class: "btn primary", onclick: openDialog }, "Check a claim")));
}
function renderPending(meta) {
  $("#app").replaceChildren(h("div", { class: "empty", style: "grid-column:1/-1" },
    h("span", { class: "spinner" }), meta.status === "queued" ? "Queued…" : "Sampling frames, reading the video, cross-examining the story…"));
}
function renderError(meta) {
  $("#app").replaceChildren(h("div", { class: "card pad", style: "grid-column:1/-1" },
    h("h2", {}, "Run failed"), h("p", {}, meta.error || "Unknown error")));
}

function render() {
  const { report } = state.data;
  const byId = Object.fromEntries(report.verdicts.map(v => [v.claim_id, v]));
  const video = h("video", { src: `/api/claims/${state.id}/video`, controls: true, preload: "metadata", playsinline: true });
  const tl = h("div", { class: "timeline", title: "Click to seek" }, h("div", { class: "track" }));
  const dur = report.duration_s || 1;
  const pct = t => `${Math.min(100, Math.max(0, (t / dur) * 100))}%`;
  for (const f of report.frames) tl.append(h("div", { class: "tick", style: `left:${pct(f.t)}` }));
  for (const v of report.verdicts) for (const t of v.evidence_times)
    tl.append(h("div", { class: `mark v-${v.verdict}`, "data-claim": v.claim_id, style: `left:${pct(t)}`, title: `${fmt(t)} · ${v.claim}`,
      onclick: e => { e.stopPropagation(); select(v.claim_id, t); } }));
  const head = h("div", { class: "playhead", style: "left:0" });
  tl.append(head);
  tl.addEventListener("click", e => {
    const r = tl.getBoundingClientRect();
    seek(((e.clientX - r.left) / r.width) * dur);
  });
  const now = h("span", {}, fmt(0));
  video.addEventListener("timeupdate", () => {
    head.style.left = pct(video.currentTime);
    now.textContent = fmt(video.currentTime);
    for (const el of document.querySelectorAll(".claim")) {
      const v = byId[el.dataset.claim];
      el.classList.toggle("live", v.evidence_times.some(t => Math.abs(t - video.currentTime) < 0.4));
    }
  });

  const left = h("section", {},
    report.mode !== "live" ? h("div", { class: "banner" }, "Offline mode: no model calls were made, so every verdict is Can't tell. Add NEBIUS_API_KEY to get real readings.") : null,
    h("div", { class: "card" }, video, tl,
      h("div", { class: "timeinfo" }, now, h("span", {}, `${report.frames.length} frames sampled · ${report.windows.length} Cosmos windows · ${fmt(dur)}`))),
    h("div", { class: "card pad evidence", id: "evidence" }, h("p", { class: "muted" }, "Select a claim to see the frames and reasoning behind its verdict.")));

  const counts = report.summary;
  const summary = h("div", { class: "summary" }, ["supported", "contradicted", "cant_tell"].map(k =>
    h("div", { class: `stat v-${k}` }, h("b", {}, counts[k] ?? 0), h("span", {}, VERDICT[k]))));

  // Group claims under the story sentence they came from.
  const groups = new Map();
  for (const c of report.claims) {
    const key = c.source || c.text;
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(c);
  }
  const story = h("div", {}, [...groups].map(([src, cs]) => h("div", { class: "sentence" },
    cs.length > 1 || cs[0].text !== src ? h("q", {}, src) : null,
    cs.map(c => {
      const v = byId[c.id];
      return h("div", { class: `claim v-${v.verdict}`, "data-claim": c.id, onclick: () => select(c.id) },
        h("span", { class: "tag" }, VERDICT[v.verdict]), h("span", {}, c.text),
        h("span", { class: "t" }, v.evidence_times.map(fmt).join(", ") || "–"));
    }))));

  const right = h("section", {},
    h("div", { class: "card pad" }, h("h2", {}, "Verdicts"), summary),
    h("div", { class: "card pad" }, h("h2", {}, "The claimant's story"), story),
    renderContext(report.context),
    h("div", { class: "card pad muted src" }, `Models: ${Object.entries(report.models).map(([k, v]) => `${k} = ${v || "–"}`).join(" · ")}`,
      h("br"), `Calls: ${report.usage.calls} (${report.usage.cache_hits} cached) · ${report.elapsed_s}s`));

  $("#app").replaceChildren(left, right);
  state.video = video;
  const first = report.verdicts.find(v => v.verdict === "contradicted") || report.verdicts[0];
  if (first) select(first.claim_id, undefined, false);
}

function renderContext(ctx) {
  if (!ctx) return null;
  const card = h("div", { class: "card pad" }, h("h2", {}, `Outside context · ${ctx.place}${ctx.date ? ` · ${ctx.date}` : ""}`));
  if (ctx.offline) { card.append(h("p", { class: "muted" }, "Tavily is offline (no TAVILY_API_KEY), so no weather or place lookup was made.")); return card; }
  for (const [key, label] of [["weather", "Weather"], ["place_facts", "Place"]]) {
    const b = ctx[key];
    if (!b) continue;
    card.append(h("p", {}, h("strong", {}, `${label}: `), b.answer || h("span", { class: "muted" }, "no summary returned")),
      h("div", { class: "src" }, b.sources.map((s, i) => [i ? " · " : "", h("a", { href: s.url, target: "_blank", rel: "noopener noreferrer" }, s.title || s.url)])));
  }
  card.append(h("p", { class: "muted src" }, "Outside records count for less than the footage."));
  return card;
}

function seek(t) {
  if (!state.video || t == null) return;
  state.video.pause();
  state.video.currentTime = t;
}

function select(claimId, t, doSeek = true) {
  const { report } = state.data;
  const v = report.verdicts.find(x => x.claim_id === claimId);
  state.selected = claimId;
  for (const el of document.querySelectorAll(".claim")) el.classList.toggle("sel", el.dataset.claim === claimId);
  for (const el of document.querySelectorAll(".mark")) el.classList.toggle("sel", el.dataset.claim === claimId);
  if (doSeek) seek(t ?? v.jump_to);

  const box = $("#evidence");
  box.className = `card pad evidence v-${v.verdict}`;
  box.replaceChildren(...[
    h("div", { class: "head" }, h("span", { class: "tag" }, VERDICT[v.verdict]), h("span", { class: "claimtext" }, v.claim)),
    h("div", { class: "why" }, v.reasoning || h("span", { class: "muted" }, "No reasoning returned.")),
    v.needed_evidence ? h("div", { class: "need" }, h("strong", {}, "Would settle it: "), v.needed_evidence) : null,
    v.evidence_frames.length ? h("div", {}, h("h2", {}, "Evidence frames"), h("div", { class: "frames" },
      v.evidence_frames.map(f => h("figure", { onclick: () => seek(f.t) },
        h("img", { src: `/api/claims/${state.id}/frames/${f.file}`, alt: `Frame at ${fmt(f.t)}`, loading: "lazy" }),
        h("figcaption", {}, fmt(f.t)))))) : null,
    v.observations.length ? h("div", {}, h("h2", { style: "margin-top:12px" }, "What Cosmos saw"), h("ul", { class: "obs" },
      v.observations.map(o => h("li", {}, h("span", { class: "when", onclick: () => seek(o.t_start) }, `${fmt(o.t_start)}–${fmt(o.t_end)}`),
        o.what, o.visibility !== "clear" ? h("span", { class: "muted" }, ` (view: ${o.visibility})`) : null)))) : null,
  ].filter(Boolean));
}

function openDialog() { $("#form-err").textContent = ""; $("#dlg").showModal(); }
$("#new").addEventListener("click", openDialog);
$("#cancel").addEventListener("click", () => $("#dlg").close());
$("#picker").addEventListener("change", e => open(e.target.value));
$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("#submit");
  btn.disabled = true;
  $("#form-err").textContent = "";
  try {
    const { id } = await api("/api/claims", { method: "POST", body: new FormData(e.target) });
    $("#dlg").close();
    e.target.reset();
    await loadList(id);
  } catch (err) {
    $("#form-err").textContent = err.message;
  } finally {
    btn.disabled = false;
  }
});

loadHealth();
loadList().catch(err => $("#app").replaceChildren(h("div", { class: "empty", style: "grid-column:1/-1" }, `Could not load claims: ${err.message}`)));
</script>
</body>
</html>
