[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "physics-witness"
version = "0.1.0"
description = "Checks a claimant's story against what the video physically shows."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pillow>=10.1",
    "imageio-ffmpeg>=0.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
physics-witness = "physics_witness.cli:main"

[tool.setuptools.packages.find]
include = ["physics_witness*"]

[tool.setuptools.package-data]
physics_witness = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
